# Adds HTTPS (Caddy) on ports 80/443 for a single server (Google Cloud, any VPS):
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
services:
  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
