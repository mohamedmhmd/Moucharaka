{% load i18n %}{% if page.has_other_pages %}<nav class="pagination" aria-label="{% trans 'Pages' %}">
  {% if page.has_previous %}<a class="btn secondary small" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.previous_page_number }}">{% trans "Précédent" %}</a>{% endif %}
  <span class="btn ghost small">{{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn secondary small" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.next_page_number }}">{% trans "Suivant" %}</a>{% endif %}
</nav>{% endif %}
