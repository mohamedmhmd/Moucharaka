# /etc/nginx/sites-available/moucharaka  (then: certbot --nginx -d moucharaka.mr)
server {
    listen 80;
    server_name moucharaka.mr www.moucharaka.mr;
    client_max_body_size 20M;

    location /static/ { alias /srv/moucharaka/staticfiles/; expires 30d; access_log off; }
    location /media/  { alias /var/lib/moucharaka/media/; expires 7d; }
    # PRIVATE_MEDIA_ROOT (identity documents) is intentionally NOT exposed.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
